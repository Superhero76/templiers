<title>La commanderie</title>
<style>

  #panneau { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; padding: 14px 16px; backdrop-filter: blur(4px); }
  #panneau h1 { margin: 0 0 10px; font-size: 1rem; font-weight: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--or); }
  .champs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .champs label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: #cbbd9f; }
  .champs input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; color: var(--encre); background: rgba(0,0,0,.45); border: 1px solid var(--bord); border-radius: 6px; padding: 8px; }
  .champs input:focus { outline: 2px solid var(--or); outline-offset: 0; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  button { font: inherit; color: #1a140c; background: var(--or); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #message { font-size: .9rem; min-height: 1.2em; }
  #message.refus { color: var(--refus); }
  #recompense { display: none; margin-top: 10px; }
  #recompense img { display: block; max-width: 100%; height: auto; border-radius: 4px; }
  .panneau-salle { display: none; }
  .panneau-salle.vu { display: block; }
  .consigne { margin: -4px 0 10px; font-size: .86rem; color: #cbbd9f; }
  .champs.un { grid-template-columns: 1fr; max-width: 240px; }
  #retour { display: none; position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); background: var(--panneau); color: var(--encre); border: 1px solid var(--bord); }
  #retour.vu { display: block; }
  #raz { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); padding: 8px 12px; background: var(--panneau); color: var(--encre); border: 1px solid var(--bord); }
  #btnSon { position: fixed; right: calc(max(16px, env(safe-area-inset-right)) + 56px); top: max(16px, env(safe-area-inset-top)); padding: 8px 10px; background: var(--panneau); color: var(--encre); border: 1px solid var(--bord); line-height: 1; }
  #btnSon::before { content: "\1F50A"; }
  #btnSon.coupe::before { content: "\1F507"; }
  #raz.arme { color: #fff; background: #b3362b; border-color: #b3362b; }
  #rideau { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; display: grid; place-items: center; color: var(--or); letter-spacing: .08em; }
  #rideau.noir { opacity: 1; pointer-events: auto; }
  #avis { position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%); padding: 6px 14px; border-radius: 6px; background: var(--panneau); border: 1px solid var(--bord); font-size: .9rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #avis.vu { opacity: 1; }
  #avis { top: calc(max(16px, env(safe-area-inset-top)) + 52px); max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; }
  #panneau.replie { display: none; }
  #porte { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #porte.vu { display: flex; flex-direction: column; justify-content: flex-end; }
  #porte .cadre { pointer-events: auto; width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; box-sizing: border-box; margin: 0 auto max(16px, env(safe-area-inset-bottom)); padding: 16px 18px; background: var(--panneau); border: 1px solid var(--bord); border-radius: 10px; }

  #message-porte.refus { color: var(--refus); }

  @media (max-width: 520px) { .champs { grid-template-columns: 1fr; } #panneau { padding: 12px; } }
</style>

  </form>

  <p class="consigne">Huit chiffres sont attendus.</p>
  <form id="saisie-chapitre" autocomplete="off">
    <div class="champs un">
      <label>Code<input id="fT" inputmode="numeric" maxlength="16" spellcheck="false"></label>

    <div class="actions">
      <button id="ouvrir-chapitre" type="submit">Essayer</button>
      <span id="message-chapitre" role="status"></span>
    </div>
  </form>
 </div>
 <div class="panneau-salle" id="p-crypte">
  <h1>Le coffre</h1>
  <p class="consigne">La dalle attend un mot de dix lettres.</p>
  <form id="saisie" autocomplete="off">
    <div class="champs">

      <button id="ouvrir" type="submit">Ouvrir</button>

  <div id="recompense"></div>

</section>

const GARDE = 20000;
function repli(prom, secours, quoi) {
  let h; const delai = new Promise((_, non) => { h = setTimeout(() => non(new Error("délai dépassé")), GARDE); });
  return Promise.race([prom, delai]).then(v => { clearTimeout(h); return v; },
    e => { clearTimeout(h); console.warn("ressource remplacée :", quoi, e && e.message); return secours(); });
}
function texSecours(nom) {

}
const aAffiner = new Map();
function suivreTex(nom, t) { if (!aAffiner.has(nom)) aAffiner.set(nom, []); aAffiner.get(nom).push(t); return t; }
let affine = false;
const GRAND = matchMedia("(min-width: 1100px) and (min-height: 650px)").matches;

const plein = nom => `./textures/${!GRAND && MOYEN.has(nom) ? "moyen/" : ""}${nom}.ktx2`;
const texJPG = nom => repli(chTex.loadAsync(`./textures/bas/${nom}.jpg`), () => texSecours(nom), nom);
async function texture(nom, couleur = false) {
  const t = sansKTX ? await texJPG(nom)
    : await repli(chKTX.loadAsync(affine ? plein(nom) : `./textures/bas/${nom}.ktx2`), () => { sansKTX = true; return texJPG(nom); }, nom);
  t.colorSpace = couleur ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = rendu.capabilities.getMaxAnisotropy();
  t.userData.nom = nom;
  return suivreTex(nom, t);
}
let affinage = null;
function affiner() {
  if (affinage) return affinage;
  affine = true;
  if (sansKTX) return affinage = Promise.resolve();
  return affinage = Promise.all([...aAffiner].map(async ([nom, liste]) => {
    const k = await repli(chKTX.loadAsync(plein(nom)), () => null, plein(nom));
    if (!k) return;
    for (const t of liste) {
      if (!t.isCompressedTexture) continue;
      t.dispose(); t.image = k.image; t.mipmaps = k.mipmaps; t.format = k.format; t.type = k.type;
      t.minFilter = k.minFilter; t.generateMipmaps = false; t.needsUpdate = true;
    }
  }));
}

const GLSL_BRUIT = `
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = 0.5, s = 0.0; for (int k = 0; k < 4; k++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
`;
const GLSL_PBR = `
#ifdef PBR
uniform sampler2D tPC, tPN, tPR; uniform float uTaille, uRef, uPalette, uNormale; uniform vec3 uTeintePBR;
#endif
`;
const USURE_DEFAUT = { grain: 0.2, poussiere: 0.5, crasse: 0.6, relief: 0.012, echelle: 1.0 };
function vieillir(mat, o = USURE_DEFAUT) {
  const u = { uGrain: { value: o.grain }, uPoussiere: { value: o.poussiere }, uCrasse: { value: o.crasse },
              uRelief: { value: o.relief }, uEchelle: { value: o.echelle }, uTeintePoussiere: { value: new THREE.Color(0x8e8576) } };
  if (o.pbr) {
    const p = o.pbr;
    Object.assign(u, { tPC: { value: p.tex.c }, tPN: { value: p.tex.n }, tPR: { value: p.tex.r }, uTaille: { value: p.taille },
                       uRef: { value: 0.24 }, uPalette: { value: p.palette ?? 0 }, uNormale: { value: p.normale ?? 1 },
                       uTeintePBR: { value: new THREE.Color(p.teinte ?? 0xffffff) } });
    mat.defines = Object.assign(mat.defines || {}, p.plan ? { PBR: "", PBR_PLAN: "" } : { PBR: "" }, p.rot ? { PBR_ROT: "" } : {});
  }
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vMonde; varying vec3 vNMonde;")
      .replace("#include <fog_vertex>", "#include <fog_vertex>\nvMonde = (modelMatrix * vec4(transformed, 1.0)).xyz; vNMonde = normalize(mat3(modelMatrix) * objectNormal);");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nuniform float uGrain, uPoussiere, uCrasse, uRelief, uEchelle; uniform vec3 uTeintePoussiere;\nvarying vec3 vMonde; varying vec3 vNMonde;\n" + GLSL_BRUIT + GLSL_PBR)
      .replace("#include <color_fragment>", `#include <color_fragment>
        vec3 pE = vMonde * uEchelle;
        #ifdef PBR
          vec3 nG = normalize(vNMonde), pT = vMonde / uTaille;
          #ifdef PBR_PLAN
            vec3 wT = vec3(0.0, 1.0, 0.0);
          #else
            vec3 wT = pow(abs(nG), vec3(6.0)); wT /= wT.x + wT.y + wT.z;
          #endif
          float sX = nG.x < 0.0 ? 1.0 : -1.0, sY = nG.y < 0.0 ? -1.0 : 1.0, sZ = nG.z < 0.0 ? -1.0 : 1.0;
          vec2 uvX = vec2(sX * pT.z, pT.y), uvY = vec2(sY * pT.x, pT.z), uvZ = vec2(sZ * pT.x, pT.y);
          #ifdef PBR_ROT
            uvX = uvX.yx; uvZ = uvZ.yx;
          #endif
          vec3 albedo = texture2D(tPC, uvY).rgb * wT.y;
          float rPBR = texture2D(tPR, uvY).g * wT.y;
          #ifndef PBR_PLAN
            albedo += texture2D(tPC, uvX).rgb * wT.x + texture2D(tPC, uvZ).rgb * wT.z;
            rPBR += texture2D(tPR, uvX).g * wT.x + texture2D(tPR, uvZ).g * wT.z;
          #endif
          vec3 palette = diffuseColor.rgb / max(diffuse, vec3(1e-3));
          float kPal = clamp(dot(palette, vec3(0.2126, 0.7152, 0.0722)) / uRef, 0.35, 1.15);
          diffuseColor.rgb = albedo * uTeintePBR * mix(1.0, kPal, uPalette);
        #endif
        diffuseColor.rgb *= mix(1.0 - uGrain, 1.0 + uGrain * 0.5, fbm(pE * 3.0));
        float haut = smoothstep(0.45, 0.9, normalize(vNMonde).y);
        float bas = 1.0 - smoothstep(0.0, 1.1, vMonde.y);
        diffuseColor.rgb *= 1.0 - uCrasse * (0.55 * bas * (1.0 - haut) + 0.35 * smoothstep(0.55, 0.8, fbm(pE * 0.7 + 5.0)));
        float poussiere = uPoussiere * haut * smoothstep(0.3, 0.75, fbm(pE * 1.6 + 11.0));
        diffuseColor.rgb = mix(diffuseColor.rgb, uTeintePoussiere, poussiere);`)
      .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\n#ifdef PBR\nroughnessFactor = rPBR;\n#endif\nroughnessFactor = clamp(roughnessFactor + poussiere * 0.5, 0.0, 1.0);")
      .replace("#include <metalnessmap_fragment>", "#include <metalnessmap_fragment>\nmetalnessFactor *= 1.0 - poussiere;")
      .replace("#include <normal_fragment_maps>", `#include <normal_fragment_maps>
        #ifdef PBR
          vec2 tY = (texture2D(tPN, uvY).xy * 2.0 - 1.0) * uNormale;
          vec3 nW = vec3(sY * tY.x + nG.x, nG.y, tY.y + nG.z) * wT.y;
          #ifndef PBR_PLAN
            vec2 tX = (texture2D(tPN, uvX).xy * 2.0 - 1.0) * uNormale, tZ = (texture2D(tPN, uvZ).xy * 2.0 - 1.0) * uNormale;

            #endif
            nW += vec3(nG.x, tX.y + nG.y, sX * tX.x + nG.z) * wT.x + vec3(sZ * tZ.x + nG.x, tZ.y + nG.y, nG.z) * wT.z;
          #endif
          normal = normalize((viewMatrix * vec4(normalize(nW), 0.0)).xyz);

        if (uRelief > 0.0) {
          float hb = fbm(pE * 6.0) + 0.5 * fbm(pE * 19.0);

          vec3 r1 = cross(dpy, normal), r2 = cross(normal, dpx);

          vec3 grad = sign(det) * (dFdx(hb) * r1 + dFdy(hb) * r2);

        }`);

const chargeur = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const cache = new Map();
function modele(nom) {
  if (!cache.has(nom)) {
    const emb = window.MODELES_DATA && window.MODELES_DATA[nom];
    cache.set(nom, repli((emb
      ? chargeur.parseAsync(Uint8Array.from(atob(emb), c => c.charCodeAt(0)).buffer, "./modeles/")
      : chargeur.loadAsync(`./modeles/${nom}.glb`)).then(g => g.scene), () => new THREE.Group(), nom));
  }
  return cache.get(nom);
}
async function poser(sc, nom, x, y, z, ry = 0, s = 1, teinte = 0x9a948c, usure = USURE_DEFAUT) {
  const o = (await modele(nom)).clone(true);
  o.position.set(x, y, z); o.rotation.y = ry; o.scale.setScalar(s);
  o.traverse(m => {
    if (m.isMesh) {
      m.castShadow = true; m.receiveShadow = true;
      if (m.material) { m.material = m.material.clone(); m.material.roughness = 0.9; m.material.metalness = 0; m.material.color.multiply(new THREE.Color(teinte)); vieillir(m.material, usure); }
    }
  });
  sc.add(o);
  return o;
}

function flamme(sc, x, y, z, couleur, intensite, portee, ombre = false) {
  const l = new THREE.PointLight(couleur, intensite, portee, 2);

const formats = { fA: /^\d{8}$/, fB: /^\d{9}$/, fC: /^[A-Z]{10}$/ };
const msg = document.getElementById("message");
document.getElementById("saisie").addEventListener("submit", async e => {
  e.preventDefault();
  const v = Object.fromEntries(Object.keys(formats).map(k => [k, normaliserCode(document.getElementById(k).value, "")]));
  const faux = Object.keys(formats).find(k => !formats[k].test(v[k]));
  if (faux) {
    msg.className = "refus";
    msg.textContent = { fA: "Salle d'armes : 8 chiffres.", fB: "Chapelle : 9 chiffres.", fC: "Crypte : un mot de dix lettres." }[faux];
    return;
  }
  const bouton = document.getElementById("ouvrir");
  bouton.disabled = true; msg.className = ""; msg.textContent = "…";
  const contenu = COFFRES.crypte ? await ouvrirCoffre(COFFRES.crypte, v.fA + v.fB + v.fC, CLE_ACCES) : null;
  bouton.disabled = false;
  if (!contenu) { msg.className = "refus"; msg.textContent = "Le coffre reste fermé."; return; }
